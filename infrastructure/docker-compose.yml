services:
  # 1. The Database: Storing moisture history & AI decisions
  db:
    image: postgres:15-alpine
    container_name: agri_db
    networks:
      - agri_net
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: agriculture_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 1.5 API Gateway (Nginx)
  api_gateway:
    image: nginx:latest
    container_name: agri_api_gateway
    networks:
      - agri_net
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service

  # 2. Local MQTT Broker: For internal service communication
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: agri_mosquitto
    networks:
      - agri_net
    restart: always
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 3. Authentication Microservice
  auth_service:
    build: 
      context: ../backend/auth_service
      dockerfile: Dockerfile
    container_name: agri_auth_service
    networks:
      - agri_net
    restart: always
    depends_on:
      - db
    env_file:
      - ../backend/.env
    ports:
      - "8011:8001"
    environment:
      # Use the docker internal network to talk to db, NOT localhost!
      - DATABASE_URL=postgresql://admin:password123@db:5432/db_auth

  # 4. (Future) Irrigation Microservice

  # 5. ngrok tunnel for real device testing across any network
  ngrok:
    image: ngrok/ngrok:latest
    container_name: agri_ngrok
    networks:
      - agri_net
    restart: unless-stopped
    depends_on:
      - api_gateway
    command:
      - "http"
      - "api_gateway:80"
      - "--authtoken=${NGROK_AUTHTOKEN}"
    ports:
      - "4040:4040"

  # 6. Database Web UI (Adminer)
  db_ui:
    image: adminer:latest
    container_name: agri_db_ui
    networks:
      - agri_net
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db

  # 7. Crop Health Microservice
  crop_health_service:
    build:
      context: ../backend/crop_health_service
      dockerfile: Dockerfile
    container_name: agri_crop_health_service
    networks:
      - agri_net
    restart: always
    depends_on:
      - db
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/db_crop_health
    volumes:
      - ./crop_health_images:/app/uploads


volumes:
  postgres_data:

networks:
  agri_net:
    driver: bridge